<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Character Test — Back Weapon Tuning</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #10151c; }
    body { font-family: "Segoe UI", Arial, sans-serif; color: #7fd4ff; user-select: none; }
    #app { position: fixed; inset: 0; }
    canvas { display: block; }
    #loadmsg {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      font-size: 14px; letter-spacing: 2px; color: #6e93a8;
    }
    /* Top-LEFT, opposite the panel, so it is readable in every tab including
       the first-person ones where the panel is the only other chrome. */
    #perf {
      position: fixed; top: 12px; left: 12px; z-index: 5;
      background: rgba(8, 20, 32, 0.82); border: 1px solid rgba(127,212,255,0.3);
      padding: 6px 8px; font-family: Consolas, monospace; font-size: 11px;
      line-height: 1.45; color: #9fd4ff; white-space: pre; pointer-events: none;
    }
    #perf b { color: #e8f4fc; font-weight: normal; }
    #perf .warn { color: #ffd66e; }
    #perf .bad { color: #ff7a6b; }
    #panel {
      position: fixed; top: 12px; right: 12px; width: 300px; max-height: calc(100vh - 24px);
      overflow-y: auto; background: rgba(8, 20, 32, 0.92); border: 1px solid rgba(127,212,255,0.35);
      padding: 12px; font-size: 11px;
    }
    /* The vehicle tab shows a four-corner telemetry column that does not fit
       the character panel's width. */
    #panel.wide { width: 390px; }
    #panel h1 { font-size: 12px; letter-spacing: 3px; margin-bottom: 8px; color: #e8f4fc; }
    fieldset { border: 1px solid #24404f; margin-bottom: 10px; padding: 8px; }
    legend { padding: 0 6px; letter-spacing: 2px; color: #ffd66e; }
    .row { display: flex; align-items: center; gap: 4px; margin: 3px 0; }
    .row label { width: 52px; color: #6e93a8; }
    .row input {
      flex: 1; width: 60px; background: #0c1826; color: #cfe6f5; border: 1px solid #24404f;
      font-size: 11px; padding: 2px 4px;
    }
    .btns { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
    button {
      cursor: pointer; background: rgba(127,212,255,0.1); color: #7fd4ff;
      border: 1px solid rgba(127,212,255,0.4); padding: 5px 10px; font-size: 11px; letter-spacing: 1px;
    }
    button:hover { background: rgba(127,212,255,0.25); }
    button.sel { background: #7fd4ff; color: #0a1826; }
    #out {
      width: 100%; height: 130px; background: #0c1826; color: #9fd4ff; border: 1px solid #24404f;
      font-family: Consolas, monospace; font-size: 10px; padding: 6px; white-space: pre; overflow: auto;
    }
    /* Telemetry is fixed-pitch on purpose: the per-wheel bars only line up as a
       column if the glyphs do, and reading four corners at a glance is the
       whole point of showing them. */
    #vehTel, #seatTel {
      background: #0c1826; border: 1px solid #24404f; color: #9fd4ff;
      font-family: Consolas, monospace; font-size: 10px; line-height: 1.35;
      padding: 6px; margin-bottom: 10px; white-space: pre; overflow-x: auto;
    }
    .hint { color: #46606f; margin-top: 6px; letter-spacing: 1px; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="perf" style="display:none"></div>
  <div id="loadmsg">LOADING CHARACTERS…</div>
  <div id="panel" style="display:none">
    <div class="btns" id="modeBtns">
      <button data-mode="back" class="sel">BACK</button>
      <button data-mode="grip">GRIP</button>
      <button data-mode="fp">VIEWMODEL</button>
      <button data-mode="ads">ADS</button>
      <button data-mode="veh">VEHICLE</button>
      <button data-mode="seat">SEAT</button>
      <button data-mode="air">AIR</button>
    </div>
    <div class="btns" id="animBtns">
      <button data-anim="idle" class="sel">IDLE</button>
      <button data-anim="run">RUN</button>
      <button data-anim="aim">AIM</button>
      <button id="swapBtn">SWAP GUNS</button>
    </div>
    <div id="backMode">
      <div id="sections"></div>
    </div>
    <div id="gripMode" style="display:none">
      <div class="btns" id="wpnBtns"></div>
      <div id="gripSection"></div>
    </div>
    <div id="fpMode" style="display:none">
      <div class="btns" id="fpWpnBtns"></div>
      <div id="fpSection"></div>
    </div>
    <div id="adsMode" style="display:none">
      <div class="btns" id="adsWpnBtns"></div>
      <div class="btns">
        <button id="adsLockBtn" class="sel">ADS LOCK</button>
        <button id="adsSnapBtn" title="centre the scope screen on the crosshair">SNAP SIGHT</button>
        <button id="adsResetBtn">RESET</button>
      </div>
      <div id="adsSection"></div>
    </div>
    <div id="vehMode" style="display:none">
      <div class="btns">
        <button id="vehReset">RESET (R)</button>
        <button id="vehCam">CAM: CHASE (C)</button>
        <button id="vehAuto">AUTOPILOT</button>
      </div>
      <pre id="vehTel"></pre>
      <div id="vehInputs"></div>
    </div>
    <div id="airMode" style="display:none">
      <div class="btns">
        <button id="airReset">RESET (R)</button>
        <button id="airCam">CAM: CHASE (C)</button>
        <button id="airAll">RUN ALL</button>
      </div>
      <div class="btns" id="airRunBtns"></div>
      <pre id="airTel"></pre>
      <div id="airInputs"></div>
    </div>
    <div id="seatMode" style="display:none">
      <div class="btns">
        <button id="seatFocus">FOCUS SEAT</button>
      </div>
      <pre id="seatTel"></pre>
      <div id="seatInputs"></div>
    </div>
    <textarea id="out" readonly></textarea>
    <div class="hint" id="hint">values update live · paste block into soldier.js BACK</div>
  </div>
  <script type="module" src="/src/chartest.js"></script>
</body>
</html>
